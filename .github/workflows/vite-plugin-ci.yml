name: Vite plugin CI

# The plugin previously had no CI at all: publish-vite-plugin.yml runs only on a
# `vite-plugin-v*` tag, so a broken build was only discovered at publish time.
# Branches are tested through their pull request; pushes run only on main.
on:
    push:
        branches:
            - main
        paths:
            - "packages/vite-plugin-surrealkit/**"
            - ".github/workflows/vite-plugin-ci.yml"
    pull_request:
        paths:
            - "packages/vite-plugin-surrealkit/**"
            - ".github/workflows/vite-plugin-ci.yml"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        name: Lint, typecheck, test and build (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # The floor declared in `engines`, plus current.
                node: ["20.19", "24"]
        defaults:
            run:
                working-directory: packages/vite-plugin-surrealkit

        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
              with:
                  node-version: ${{ matrix.node }}

            # The version comes from the package's `packageManager` field.
            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
              with:
                  package_json_file: packages/vite-plugin-surrealkit/package.json

            # The package commits its own pnpm-lock.yaml; install exactly that.
            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm run lint

            - name: Typecheck
              run: pnpm run typecheck

            # These boot real Vite dev servers and a filesystem watcher; they
            # are what catches a Vite release breaking schema watching.
            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm run build
