name: Publish Vite Plugin

on:
    push:
        tags:
            - "vite-plugin-v*"
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        name: Publish vite-plugin-surrealkit to npm
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: packages/vite-plugin-surrealkit

        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
                  # The published package is built without restoring a cache.
                  package-manager-cache: false

            # The version comes from the package's `packageManager` field.
            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
              with:
                  package_json_file: packages/vite-plugin-surrealkit/package.json

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm run typecheck

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm run build

            - name: Publish package
              if: startsWith(github.ref, 'refs/tags/')
              run: pnpm publish --provenance --access public --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
